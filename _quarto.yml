project:
  type: book
  output-dir: _book
  resources:
    - "**/*.json"
    - "**/*.jsonld"
    - "**/*.ttl"
    - "**/*.parquet"
    - "**/*.jsonl"
    - "vdf/**"

book:
  title: "GeoCroissant Recipes"
  author:
    - "Croissant & GeoCroissant Working Group"
    - "croissant@mlcommons.org"
    - "croissant-geo@mlcommons.org"
  date: "Jan 20, 2026"
  search: true
  repo-url: https://github.com/ieee-grss-veda/veda-dcai
  page-navigation: true
  sidebar:
   search: true
   logo: "assets/geocr.jpg"
  page-footer:
    left: "GeoCroissant Recipes | [Vocabulary Portal](vdf/index.html)"
    center: "License: CC BY-ND 4.0"
    right:
      - icon: github
        href: https://github.com/ieee-grss-veda/veda-dcai

  chapters:
    - index.qmd
    - part: "**Introduction**"
      chapters:
        - text: "Overview of GeoCroissant"
          file: geocroissant_overview.md
        - text: "Introduction to GeoCroissant"
          file: "Introduction to Geocroissant/Introduction to Geocroissant.ipynb"
        - text: "Metadata Catalog & JSON Artifacts"
          file: json-metadata.qmd
    - part: "**Specification**"
      chapters:
        - text: "Background & Motivation"
          file: spec-background.qmd
        - text: "Property Reference"
          file: spec-properties.qmd
        - text: "Use Cases"
          file: spec-usecases.qmd
        - text: "Appendices"
          file: spec-appendix.qmd
    - part: "**Catalog to GeoCroissant**"
      chapters:
        - text: "STAC to GeoCroissant"
          file: "STAC to GeoCroissant/STAC to Geocroissant.ipynb"
        - text: "NASA UMM to GeoCroissant"
          file: "Unified Metadata Model to GeoCroissant/NASA-UMM to GeoCroissant.ipynb"
        - text: "CEDA CMIP6 to GeoCroissant"
          file: "CEDA-UK to GeoCroissant/CEDA_UK to GeoCrossiant.ipynb"
        - text: "Google Earth Engine to GeoCroissant"
          file: "GEE to GeoCroissant/GEE to GeoCroissant.ipynb"
        - text: "Kaggle to GeoCroissant"
          file: "Kaggle GeoCroissant/Kaggle-GeoCroissant.ipynb"
    - part: "**Data Format to GeoCroissant**"
      chapters:
        - text: "GeoParquet to GeoCroissant"
          file: "GeoCroissant GeoParquet Support/GeoParquet to GeoCroissant.ipynb"
        - text: "Landslide4Sense HDF5 to GeoCroissant"
          file: "Landslide4Sense-HDF5 GeoCroissant/Landslide4Sense-HDF5 GeoCroissant.ipynb"
        - text: "Space Weather & Heliophysics (SDO)"
          file: "Solar Dynamics Observatory GeoCroissant/SDO GeoCroissant.ipynb"
    - part: "**GeoCroissant Extensions**"
      chapters:
        - text: "Time-Series Support"
          file: "GeoCroissant Time-Series Support/GeoCroissant Time-Series Support.ipynb"
        - text: "OGC-TDML to GeoCroissant"
          file: "OGC-TDML GeoCroissant Support/OGC-TDML to GeoCroissant/OGC-TDML to GeoCroissant.ipynb"
        - text: "GeoCroissant to OGC-TDML"
          file: "OGC-TDML GeoCroissant Support/GeoCroissant to OGC-TDML/GeoCroissant to OGC-TDML.ipynb"
    - part: "**GeoCroissant RAI**"
      chapters:
        - text: "Responsible AI (RAI) Specifications"
          file: "GeoCroissant & Responsible AI (RAI) Specs/GeoCroissant (RAI) Specifications.ipynb"
    - part: "**GeoCroissant to Standards**"
      chapters:
        - text: "GeoCroissant to STAC"
          file: "GeoCroissant to STAC/conversion-stac-notebook.ipynb"
        - text: "GeoCroissant to GeoDCAT"
          file: "GeoCroissant to GeoDCAT/conversion-geodcat-notebook.ipynb"
    - references.qmd
    
execute:
  eval: false
  enabled: false
  timeout: 300
  error: false
  warning: false
  echo: true
  output: true
  freeze: false
  cache: false
  
format:
  html:
    number-sections: false
    theme:
      - cosmo
    css: custom.css
    code-tools: false
    code-block-bg: true
    code-block-border-left: "#31BAE9"
    highlight-style: github
    code-overflow: wrap
    df-print: paged
